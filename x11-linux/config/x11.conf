# x11-linux configuration
# Sourced as a shell file by scripts/common.sh — keep this POSIX-shell-safe
# (VAR=value, no spaces around '=', quote anything with spaces).

# ---- Target distribution ----
# proot-distro does NOT publish a Linux Mint ARM64 rootfs. There is no
# genuine, official Mint/LMDE image compatible with proot-distro's install
# mechanism, so this project always falls back to Debian ARM64 and reports
# that honestly instead of mislabeling Debian as Mint.
DISTRO_ALIAS="debian"
DISTRO_DISPLAY_NAME="Debian ARM64"
DISTRO_MODE="Fallback"
DISTRO_FALLBACK_REASON="Linux Mint ARM64 rootfs is not available through proot-distro"

# ---- Display ----
DISPLAY_NUM=":0"

# ---- Termux (host-side) packages required ----
TERMUX_PACKAGES="proot-distro pulseaudio termux-tools wget curl git nano tar gzip unzip zip x11-repo termux-x11-nightly"

# ---- Packages installed inside the Linux rootfs ----
LINUX_PACKAGES="xfce4 xfce4-goodies dbus dbus-x11 x11-xserver-utils xterm thunar xfce4-terminal sudo nano curl wget git unzip zip procps psmisc htop"

# ---- Thresholds ----
LOW_RAM_MB=2048
LOW_STORAGE_MB=1024

# ---- Timeouts (seconds) ----
NET_CHECK_TIMEOUT=6
X11_CONNECT_TIMEOUT=8
X11_SERVER_STARTUP_WAIT=5
